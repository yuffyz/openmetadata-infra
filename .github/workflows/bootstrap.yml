name: openmetadata-bootstrap

# Provisions the account-wide, one-time resources in bootstrap/ -- the things
# that must exist BEFORE openmetadata-infra can deploy, and that must survive
# an environment being destroyed.
#
# Tick the services to provision. `plan` is never gated; `apply` runs in the
# "bootstrap" GitHub Environment, so reviewers can be required there.
#
# --- Read this before the first run ----------------------------------------
#
# THE SELECTION IS THE COMPLETE DESIRED STATE, NOT A DELTA. Anything left
# unticked is passed to Terraform as create_* = false, so a resource already in
# state that is not ticked plans as a DELETE. That is deliberate -- it is how
# Terraform works and hiding it with -target would hide real drift -- but it
# means you tick everything you want to KEEP, not just the thing you are adding.
# The guard in the plan job refuses to hand an apply a plan containing deletes
# unless you NAME the addresses it may delete in allow_destroy, so a mistake
# here costs a re-run, not an outage.
#
# Removing one service deliberately -- production's accelerator, say -- is
# therefore two inputs, not a blanket override:
#
#   accelerator_environments = dev
#   allow_destroy            = aws_globalaccelerator_accelerator.app["production"]
#
# If the plan then also deletes something you did not name, it still fails.
# That is the case worth having: forgetting to tick oidc_provider while removing
# an accelerator would otherwise take the deploy role's identity provider with
# it, under an approval you thought applied only to the accelerator.
#
# STATE MOVED FROM LOCAL TO S3. bootstrap/ was applied by hand with local state
# ("it's a bootstrap"), which a workflow cannot use -- a runner starts with an
# empty state file and would try to CREATE resources that already exist. This
# workflow keeps bootstrap state in the same bucket as the environments, under
# <prefix>/bootstrap/terraform.tfstate. Migrate the existing local state ONCE,
# from the machine that holds it, before running apply here:
#
#   cd bootstrap
#   cp ../backend.tf .                       # the same generic S3 backend block
#   terraform init -migrate-state \
#     -backend-config="bucket=<TF_STATE_BUCKET>" \
#     -backend-config="key=<TF_STATE_PREFIX>/bootstrap/terraform.tfstate" \
#     -backend-config="region=<TF_STATE_REGION>" \
#     -backend-config="encrypt=true"
#   rm backend.tf                            # not committed; injected at run time
#
# Skipping that is caught rather than acted on: the plan job fails if the remote
# state is empty while the deploy role already exists in the account, because
# that combination can only mean the local state has not been migrated.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options:
          - plan
          - apply
        default: plan

      # One toggle per service. workflow_dispatch has no multi-select, and
      # booleans render as checkboxes -- which reads better than a comma
      # separated string and cannot be misspelled.
      oidc_provider:
        description: "GitHub OIDC provider (only one per account for this URL)"
        type: boolean
        default: false
      state_bucket:
        description: "Terraform state S3 bucket (leave off if it already exists)"
        type: boolean
        default: false
      opensearch_service_linked_role:
        description: "OpenSearch service-linked role (account-wide, shared by every domain)"
        type: boolean
        default: false
      nat_eips:
        description: "Stable NAT egress EIPs, one per environment (~$0.12/day each)"
        type: boolean
        default: false
      global_accelerator:
        description: "Global Accelerator per environment, holds the static IPs (~$18/mo each)"
        type: boolean
        default: false

      accelerator_environments:
        description: "Which environments get an accelerator (comma separated). Empty = all of environment_names"
        type: string
        default: "dev"

      allow_destroy:
        description: 'Resource addresses this plan may delete, comma separated (or "destroy" for any)'
        type: string
        default: ""

# Account-wide, so one at a time -- no environment in the key. Two concurrent
# applies would fight over the same state file and the same IAM role.
concurrency:
  group: openmetadata-bootstrap
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  TF_DIR: bootstrap
  # >= 1.10 required for S3 native state locking (use_lockfile)
  TF_VERSION: "1.15.8"
  # The same generic backend block the environments use; values come from
  # -backend-config at init time.
  BACKEND_FILE: backend.tf
  # Its own key, alongside the environments rather than inside one -- bootstrap
  # outlives them all.
  STATE_KEY: ${{ vars.TF_STATE_PREFIX || 'openmetadata' }}/bootstrap/terraform.tfstate
  # Must match var.role_name in bootstrap/variables.tf. Used only by the
  # unmigrated-state guard below.
  ROLE_NAME: openmetadata-infra-deploy

jobs:
  plan:
    name: Plan (bootstrap)
    runs-on: ubuntu-latest
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      # No tfvars-file: every value arrives as -var, because the service
      # selection comes from the inputs above rather than a committed file.
      - name: Prepare Terraform
        uses: ./.github/actions/prepare
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ env.STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}
          terraform-dir: ${{ env.TF_DIR }}
          backend-file: ${{ env.BACKEND_FILE }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (advisory)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive || echo "::warning::Terraform files are not canonically formatted"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # The chicken-and-egg check.
      #
      # aws_iam_role.deploy is unconditional in bootstrap/main.tf -- there is no
      # create_* toggle for it, because it is the role this very workflow
      # assumes. With a migrated state that is fine. With an EMPTY state,
      # Terraform plans to create a role that already exists and apply fails
      # deep in the run with EntityAlreadyExists, which reads like a naming
      # collision rather than a missing state file.
      #
      # Catching it here also stops the more damaging version: an empty state
      # plus a ticked global_accelerator would provision a SECOND accelerator
      # with different static addresses, silently, at ~$18/month.
      - name: Guard against unmigrated local state
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -uo pipefail
          n=$(terraform state list 2>/dev/null | grep -c . || true)
          echo "resources in remote state: $n"
          if [ "$n" -ne 0 ]; then
            echo "State is populated; nothing to check."
            exit 0
          fi

          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "::error::Remote state at ${STATE_KEY} is EMPTY, but IAM role ${ROLE_NAME} already exists in this account. bootstrap/ has been applied before with LOCAL state and it has not been migrated. Applying now would try to recreate resources that exist (and could provision a second Global Accelerator with new addresses). Migrate the local state first -- the exact commands are in the header of this workflow file and in bootstrap/README.md."
            exit 1
          fi
          echo "Empty state and no existing deploy role: this is a genuine first run."

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          # Via env rather than inline ${{ }} so nothing from a variable or
          # secret is pasted into the script itself.
          TF_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GH_REPOSITORY: ${{ github.repository }}
          IN_OIDC: ${{ github.event.inputs.oidc_provider }}
          IN_BUCKET: ${{ github.event.inputs.state_bucket }}
          IN_SLR: ${{ github.event.inputs.opensearch_service_linked_role }}
          IN_NAT: ${{ github.event.inputs.nat_eips }}
          IN_GA: ${{ github.event.inputs.global_accelerator }}
          IN_GA_ENVS: ${{ github.event.inputs.accelerator_environments }}
        run: |
          set -euo pipefail

          # github_org has no default in variables.tf and github_repo defaults to
          # a different repo name, so both are derived from the repository this
          # workflow is running in rather than being configured twice.
          org="${GH_REPOSITORY%%/*}"
          repo="${GH_REPOSITORY##*/}"

          echo "Services selected for this plan:"
          printf '  %-38s %s\n' \
            "oidc_provider"                  "$IN_OIDC" \
            "state_bucket"                   "$IN_BUCKET" \
            "opensearch_service_linked_role" "$IN_SLR" \
            "nat_eips"                       "$IN_NAT" \
            "global_accelerator"             "$IN_GA" \
            "accelerator_environments"       "${IN_GA_ENVS:-<all environments>}"
          echo
          echo "Anything false above is planned as ABSENT, not as unchanged."

          # A Terraform list literal, from the comma separated input. Empty
          # yields [], which the module reads as "every entry in
          # environment_names" -- the original behaviour.
          ga_envs=$(printf '%s' "${IN_GA_ENVS:-}" | tr -d '[:space:]' \
            | awk -F, '{for(i=1;i<=NF;i++) if ($i != "") printf "%s\"%s\"", (n++?",":""), $i}')
          ga_envs="[${ga_envs}]"
          echo "accelerator environments -> ${ga_envs}"

          # state_bucket is passed regardless of whether we are creating the
          # bucket: it also drives aws_iam_role_policy.state, the inline policy
          # that lets the deploy role read and write remote state. Omit it and
          # that policy plans as a delete, which would break every deployment.
          terraform plan -input=false -out=tfplan \
            -var="region=${TF_REGION}" \
            -var="state_bucket=${TF_STATE_BUCKET}" \
            -var="github_org=${org}" \
            -var="github_repo=${repo}" \
            -var="create_oidc_provider=${IN_OIDC}" \
            -var="create_state_bucket=${IN_BUCKET}" \
            -var="create_opensearch_service_linked_role=${IN_SLR}" \
            -var="create_nat_eips=${IN_NAT}" \
            -var="create_global_accelerator=${IN_GA}" \
            -var="global_accelerator_environments=${ga_envs}"

      # Refuse to hand an apply a plan that deletes things, unless the operator
      # typed the confirmation. The selection model makes an accidental delete
      # easy -- forget to tick nat_eips and its EIPs are planned away -- and
      # some of these deletions are not recoverable: releasing an accelerator or
      # an EIP means AWS will not give the same addresses back, and every
      # external DNS record and firewall allowlist pointing at them goes stale.
      # Refuse to hand an apply a plan that deletes things, unless the operator
      # named what it may delete.
      #
      # The selection model makes an accidental delete easy -- forget to tick
      # nat_eips and its EIPs are planned away -- and some of these deletions
      # are not recoverable: releasing an Elastic IP or a Global Accelerator
      # means AWS will not hand the same addresses back, and every firewall
      # allowlist, network policy and DNS record naming them goes stale.
      #
      # allow_destroy takes one of three things:
      #
      #   (empty)                no deletion is permitted; the plan is refused
      #   <addresses>            a comma separated list of Terraform resource
      #                          addresses. The plan may delete EXACTLY those
      #                          and nothing else -- an unexpected extra
      #                          deletion still fails. This is the form to use.
      #   destroy                blanket: any deletion is permitted. A blunt
      #                          instrument, kept for a genuine teardown.
      #
      # The targeted form is the point. "I am removing production's
      # accelerator" is a different statement from "delete whatever this plan
      # decided to delete", and only the first one survives a mistake in the
      # service checkboxes above.
      - name: Guard against destructive plans
        working-directory: ${{ env.TF_DIR }}
        env:
          ALLOW_DESTROY: ${{ github.event.inputs.allow_destroy }}
        run: |
          set -uo pipefail
          terraform show -json tfplan > plan.json

          python3 - <<'PY'
          import json, os, sys

          allow = (os.environ.get("ALLOW_DESTROY") or "").strip()
          plan = json.load(open("plan.json"))

          dels = [
              (r["address"], "+".join(r.get("change", {}).get("actions", [])))
              for r in plan.get("resource_changes", [])
              if "delete" in r.get("change", {}).get("actions", [])
          ]

          if not dels:
              print("No deletions in this plan.")
              sys.exit(0)

          print("This plan DELETES:")
          for addr, acts in dels:
              print(f"  {addr}  ({acts})")
          print()

          if allow == "destroy":
              print("::warning::Every deletion above permitted by the blanket allow_destroy=destroy.")
              sys.exit(0)

          if allow:
              named = {a.strip() for a in allow.split(",") if a.strip()}
              planned = {addr for addr, _ in dels}
              unexpected = sorted(planned - named)
              missing = sorted(named - planned)

              if unexpected:
                  print("::error::allow_destroy named specific addresses, but this plan ALSO deletes: "
                        + "; ".join(unexpected)
                        + ". That is the guard doing its job -- the extra deletions are almost always a"
                        " service left unticked that should have stayed on, because the selection is the"
                        " full desired state and not a delta. Fix the checkboxes and re-plan; only widen"
                        " allow_destroy once the list matches what you actually intend.")
                  sys.exit(1)

              if missing:
                  print("::warning::allow_destroy also named addresses this plan does not delete (already"
                        " gone, or misspelled): " + "; ".join(missing))

              print("::warning::Deletion permitted: every address this plan deletes was named in allow_destroy.")
              sys.exit(0)

          print('::error::This plan deletes the resources listed above and allow_destroy is empty. If the'
                ' deletions are unintended -- which is usually a service left unticked that should have'
                ' stayed on, since the selection is the full desired state and not a delta -- fix the'
                ' checkboxes and re-plan. If they ARE intended, set allow_destroy to the exact addresses,'
                ' comma separated, e.g.  aws_globalaccelerator_accelerator.app["production"]  . Releasing'
                ' an Elastic IP or an accelerator loses those addresses permanently.')
          sys.exit(1)
          PY

      - name: Save plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-bootstrap
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply (bootstrap)
    if: ${{ github.event.inputs.action == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    # Account-wide changes, so its own gate rather than dev's or production's.
    # Referencing an environment that does not exist yet creates it with no
    # protection rules -- add reviewers under Settings -> Environments.
    environment: bootstrap
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      - name: Prepare Terraform
        uses: ./.github/actions/prepare
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ env.STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}
          terraform-dir: ${{ env.TF_DIR }}
          backend-file: ${{ env.BACKEND_FILE }}
          terraform-version: ${{ env.TF_VERSION }}

      # The saved plan, not a fresh one. Applying a re-planned run would skip
      # both guards above.
      - name: Fetch plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-bootstrap
          path: ${{ env.TF_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      # What the rest of the repo needs from here. Printed on every apply
      # because these values are what get pasted into an environment's tfvars
      # and into DNS tickets, and hunting them out of Terraform state afterwards
      # is the annoying part.
      - name: Report bootstrap outputs
        if: success()
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -uo pipefail
          get() { terraform output -json "$1" 2>/dev/null || echo 'null'; }

          {
            echo "## Bootstrap applied"
            echo
            echo "| Output | Value |"
            echo "|---|---|"
            printf '| Deploy role ARN | `%s` |\n' "$(terraform output -raw role_arn 2>/dev/null || echo '-')"
            printf '| Accelerator names | `%s` |\n'     "$(get accelerator_names)"
            printf '| Accelerator ARNs | `%s` |\n'      "$(get accelerator_arns)"
            printf '| Accelerator static IPs | `%s` |\n' "$(get accelerator_static_ips)"
            printf '| NAT egress IPs | `%s` |\n'        "$(get nat_egress_ips)"
            echo
            echo "Next steps, where relevant:"
            echo "- Set \`app_accelerator_arn\` in that environment's tfvars to the matching ARN above (the ARN, not the name -- see global_accelerator.tf)."
            echo "- Publish the static IPs for the externally-managed DNS record."
            echo "- Allowlist the NAT egress IPs wherever the pods must reach out (Snowflake network policies, partner firewalls)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Outputs also printed here for the log:"
          terraform output || true
