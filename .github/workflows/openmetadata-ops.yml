name: openmetadata-ops

# Runs read-only diagnostics and a server restart against a deployed
# OpenMetadata environment.
#
# Why this exists in CI rather than as local kubectl: `eks.tf` sets
# `authentication_mode = "API"` with
# `bootstrap_cluster_creator_admin_permissions = true`, so cluster-admin belongs
# to the principal that created the cluster -- the GitHub OIDC role in
# AWS_ROLE_ARN. Individuals need an EKS access entry for their own ARN, which is
# its own troubleshooting exercise (SSO roles must be mapped by their IAM role
# ARN with the path stripped, IAM users by their user ARN). This workflow needs
# no access entry at all.
#
# Deliberately NOT a free-text kubectl runner: this role holds cluster-admin, so
# an arbitrary-command input would hand cluster-admin to anyone with write access
# to the repo. Add a named action below when you need a new operation.
#
# `diagnose` is the one to reach for when the UI's Explore page is empty while
# ingestion reports success. Explore reads only from the search index, so an
# OpenSearch auth failure looks exactly like "no metadata" -- the search index
# sink fails with `TransportException: Unauthorized access` while entities sit
# happily in the application database.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - production
        default: dev
      action:
        description: What to do
        type: choice
        options:
          - diagnose                 # read-only; changes nothing
          - restart-server           # rollout restart of the OpenMetadata deployment
          - diagnose-and-restart     # diagnose, restart, then diagnose again
          - test-search-write        # probe WRITE auth: creates and deletes a throwaway index
          - reset-opensearch-password  # MUTATES: verified bounce of the domain password back to the secret's; restarts a stale server
          - rotate-opensearch-password # MUTATES: new password on BOTH domain and secret, then restart (prefer reset)
          - reduce-replicas          # MUTATES (dev only): number_of_replicas = 0 on non-system indices
          - set-shard-template       # MUTATES: index template, 1 primary shard for OpenMetadata indices
          - show-exposure            # read-only: how the UI is published (LB, listeners, cert, DNS, SG)
        default: diagnose

concurrency:
  # Serialise per environment: two concurrent rollout restarts of the same
  # deployment is never what anyone wanted.
  group: openmetadata-ops-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  # Hardcoded in terraform/namespace.tf, not a variable.
  NAMESPACE: openmetadata
  # Helm release name, so both the Deployment and its Service are `openmetadata`.
  RELEASE: openmetadata
  # Read cluster/domain names from the same per-environment tfvars the deploy
  # workflow uses, so this cannot drift from what was actually applied.
  TFVARS_FILE: config/${{ github.event.inputs.environment }}.auto.tfvars

jobs:
  ops:
    name: ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    # Inherits the selected GitHub Environment's protection rules, matching
    # deploy.yml: restarting the production server should be reviewable.
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      # Repository variables and secrets do not travel with the code: an
      # unconfigured repo substitutes empty strings, which would surface much
      # later as an unrecognisable AWS or kubectl error. Fail here instead,
      # naming the setting. Values arrive via env so nothing from a secret is
      # ever pasted into the shell script itself.
      - name: Validate required settings
        env:
          IN_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          IN_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          fail=0
          for v in IN_ROLE_ARN IN_AWS_REGION; do
            if [ -z "${!v:-}" ]; then
              echo "::error::${v#IN_} is not set (repository secret/variable)"
              fail=1
            fi
          done
          [ -f "$TFVARS_FILE" ] || { echo "::error::$TFVARS_FILE not found"; fail=1; }
          exit $fail

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Parsed out of tfvars rather than terraform output: reading an output
      # would mean a full init against remote state just to learn two names.
      - name: Resolve cluster and OpenSearch domain
        run: |
          set -euo pipefail
          # `|| true` so a missing key produces the named error below rather than
          # a bare pipefail exit with no explanation.
          cluster=$(grep -E '^[[:space:]]*eks_cluster_name[[:space:]]*=' "$TFVARS_FILE" \
                    | head -1 | cut -d'"' -f2 || true)
          # Only present when the environment uses an AWS-managed OpenSearch
          # domain (provisioner = "aws"). Absent means the module default --
          # OpenSearch running in-cluster via the deps chart -- and the domain
          # lookups below are skipped.
          domain=$(grep -E '^[[:space:]]*domain_name[[:space:]]*=' "$TFVARS_FILE" \
                   | head -1 | cut -d'"' -f2 || true)

          [ -n "$cluster" ] || { echo "::error::eks_cluster_name not found in $TFVARS_FILE"; exit 1; }

          echo "CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "OS_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "Cluster: $cluster"
          echo "OpenSearch domain: ${domain:-<in-cluster, no AWS domain>}"

      - name: Configure kubectl
        run: |
          set -euo pipefail
          kubectl version --client
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "$CLUSTER"
          kubectl get nodes -o wide

      - name: Diagnose
        if: ${{ github.event.inputs.action != 'restart-server' }}
        run: |
          set -uo pipefail   # not -e: every check should report, not abort the run

          echo "::group::Workloads"
          kubectl get deploy,pods -n "$NAMESPACE" -o wide
          echo "::endgroup::"

          echo "::group::Search credential drift (server pod vs Kubernetes secret)"
          # The module regenerates the OpenSearch master password with
          # random_password, and the OpenMetadata chart embeds it into
          # openmetadata.yaml at CONTAINER START. A terraform apply that rolls the
          # password therefore updates the secret while the running pod keeps the
          # old one in memory -- search writes then fail as Unauthorized with
          # everything else healthy. Compare hashes so nothing secret is logged.
          #
          # Hash only NON-EMPTY values. sha256sum of empty input is a perfectly
          # valid digest (e3b0c442...), so hashing unconditionally would make a
          # missing secret and an unset pod variable compare EQUAL and report
          # "no drift" -- the exact opposite of the truth.
          sec_b64=$(kubectl get secret -n "$NAMESPACE" opensearch-credentials \
                      -o jsonpath='{.data.password}' 2>/dev/null || true)
          pod_raw=$(kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- \
                      sh -c 'printf %s "${ELASTICSEARCH_PASSWORD:-}"' 2>/dev/null || true)

          sec_hash=""
          pod_hash=""
          [ -n "$sec_b64" ] && sec_hash=$(printf %s "$sec_b64" | base64 -d | sha256sum | cut -c1-16)
          [ -n "$pod_raw" ] && pod_hash=$(printf %s "$pod_raw" | sha256sum | cut -c1-16)

          echo "secret password sha256[0:16] : ${sec_hash:-<empty or unreadable>}"
          echo "pod ELASTICSEARCH_PASSWORD    : ${pod_hash:-<empty or unreadable>}"

          if [ -z "$sec_hash" ]; then
            echo "::warning::Could not read the opensearch-credentials secret"
          elif [ -z "$pod_hash" ]; then
            echo "::warning::ELASTICSEARCH_PASSWORD is empty/unset in the server pod -- the chart is not wiring the secret through"
          elif [ "$sec_hash" != "$pod_hash" ]; then
            echo "::warning::Server pod's OpenSearch password does not match the secret -- run action 'restart-server'"
          else
            echo "Passwords match; drift is not the cause."
          fi
          # Names only, never values.
          kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- \
            sh -c 'env | grep -iE "^(ELASTICSEARCH|OPENSEARCH|SEARCH)" | cut -d= -f1 | sort' || true
          echo "::endgroup::"

          if [ -n "${OS_DOMAIN:-}" ]; then
            echo "::group::AWS view of the OpenSearch domain"
            aws opensearch describe-domain-health --domain-name "$OS_DOMAIN" \
              --region "${{ vars.AWS_REGION }}" || true
            aws opensearch describe-domain --domain-name "$OS_DOMAIN" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'DomainStatus.{Version:EngineVersion,Processing:Processing,FGAC:AdvancedSecurityOptions.Enabled,InternalUserDB:AdvancedSecurityOptions.InternalUserDatabaseEnabled,Endpoint:Endpoints.vpc}' \
              --output table || true

            # The MASTER USER NAME the domain actually has, and whether the last
            # AdvancedSecurityOptions change ever landed. An update-domain-config
            # call that AWS treats as a no-op returns State=Active with an
            # unchanged UpdateDate -- which looks like success in the CLI output
            # but changed nothing.
            aws opensearch describe-domain-config --domain-name "$OS_DOMAIN" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'DomainConfig.AdvancedSecurityOptions.{MasterUserName:Options.MasterUserOptions.MasterUserName,Enabled:Options.Enabled,InternalUserDB:Options.InternalUserDatabaseEnabled,State:Status.State,UpdateDate:Status.UpdateDate,UpdateVersion:Status.UpdateVersion}' \
              --output table || true

            aws opensearch describe-domain-change-progress --domain-name "$OS_DOMAIN" \
              --region "${{ vars.AWS_REGION }}" || true
            echo "::endgroup::"
          fi

          # The secret's VALUE has only ever been compared by hash against the
          # pod. A hash match proves they agree with each other, not that either
          # is well-formed -- if the stored password itself carries wrapping
          # quotes or a trailing newline (as the host/user variables demonstrably
          # do), both sides would send the malformed value and both would be
          # rejected, with matching hashes throughout. Report shape, not content.
          echo "::group::Stored password shape (no value printed)"
          pw=$(kubectl get secret -n "$NAMESPACE" opensearch-credentials \
                 -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)
          printf 'length            : %s\n' "$(printf %s "$pw" | wc -c | tr -d ' ')"
          case "$pw" in
            '"'*) echo 'starts with quote : YES  <-- would be sent literally';;
            *)    echo 'starts with quote : no';;
          esac
          case "$pw" in
            *'"') echo 'ends with quote   : YES  <-- would be sent literally';;
            *)    echo 'ends with quote   : no';;
          esac
          case "$pw" in
            *[[:space:]]*) echo 'contains whitespace: YES  <-- suspicious';;
            *)             echo 'contains whitespace: no';;
          esac
          echo "first byte class  : $(printf %s "$pw" | cut -c1 | od -An -c | tr -d ' ')"
          echo "last byte class   : $(printf %s "$pw" | rev | cut -c1 | od -An -c | tr -d ' ')"
          echo "::endgroup::"

          echo "::group::Recent server-side search errors"
          kubectl logs -n "$NAMESPACE" "deploy/$RELEASE" --tail=400 2>/dev/null \
            | grep -iE 'opensearch|elasticsearch|unauthorized|index' | tail -40 || true
          echo "::endgroup::"

      # Probes what indexing actually needs: reach the cluster, list indices with
      # their doc counts, and (in write mode) create an index, write a document,
      # bulk-write, delete. A 200 on /_cluster/health only proves the credentials
      # authenticate for a READ -- the search sink creates indices and issues
      # _bulk writes, which are authorised separately and can also be refused by
      # a cluster-level write block.
      #
      # Runs in a THROWAWAY curl pod rather than via `kubectl exec` on the
      # server. The OpenMetadata server image ships no HTTP client: an earlier
      # run of this workflow reported "curl absent from image" and skipped the
      # check silently, which is worse than failing -- it reads as a pass. The
      # probe pod lands on the same nodes, so it presents the same node security
      # group to the VPC-only domain; the network path under test is identical.
      #
      # The password is injected by secretKeyRef, so it appears neither in the
      # pod spec nor in this log.
      #
      # Write mode uses a throwaway index (om-auth-probe) and removes it again.
      # It never touches OpenMetadata's own indices.
      - name: Probe OpenSearch
        if: ${{ github.event.inputs.action != 'restart-server' }}
        env:
          MODE: ${{ github.event.inputs.action == 'test-search-write' && 'write' || 'read' }}
        run: |
          set -uo pipefail

          # Connection settings come from the server pod's own environment, so
          # the probe targets exactly what the server targets. Note the chart
          # sets ELASTICSEARCH_USER, not ELASTICSEARCH_USERNAME.
          dump=$(kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- sh -c '
            echo "H=${ELASTICSEARCH_HOST:-}"
            echo "P=${ELASTICSEARCH_PORT:-443}"
            echo "S=${ELASTICSEARCH_SCHEME:-https}"
            echo "U=${ELASTICSEARCH_USER:-${ELASTICSEARCH_USERNAME:-admin}}"' 2>/dev/null)
          OS_HOST=$(printf %s "$dump" | sed -n 's/^H=//p')
          OS_PORT=$(printf %s "$dump" | sed -n 's/^P=//p')
          OS_SCHEME=$(printf %s "$dump" | sed -n 's/^S=//p')
          OS_USER=$(printf %s "$dump" | sed -n 's/^U=//p')

          # A previous run produced `"https"://"vpc-...":"443"` and every request
          # came back HTTP 000 -- curl could not resolve a hostname with literal
          # quote characters in it. Print the raw bytes so the values are not a
          # matter of inference, then strip surrounding quotes, stray CRs and
          # whitespace so the probe runs regardless.
          echo "raw values as seen in the pod, delimited by []:"
          printf %s "$dump" | sed -n 's/^\([HPSU]\)=\(.*\)$/  \1=[\2]/p'
          echo "byte dump:"
          printf %s "$dump" | od -c | head -12

          strip() {
            printf %s "$1" | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          OS_HOST=$(strip "$OS_HOST")
          OS_PORT=$(strip "$OS_PORT")
          OS_SCHEME=$(strip "$OS_SCHEME")
          OS_USER=$(strip "$OS_USER")

          if [ -z "${OS_HOST:-}" ]; then
            echo "::error::ELASTICSEARCH_HOST is empty in the server pod"
            exit 1
          fi

          # If stripping changed anything, the server's own configuration is
          # carrying those characters too -- worth surfacing loudly.
          if printf %s "$dump" | grep -q '="'; then
            echo "::warning::Pod env values are wrapped in literal quotes; the chart is double-quoting them"
          fi
          echo "target: $OS_SCHEME://$OS_HOST:$OS_PORT as $OS_USER (mode=$MODE)"

          read -r -d '' SCRIPT <<'PROBE' || true
          set -u
          B="$OS_SCHEME://$OS_HOST:$OS_PORT"
          # 4000 truncated the index list mid-row on a real run: ~124 indices at
          # ~80 bytes each is ~10 KB, and the rows that got cut are exactly the
          # ones you go looking for. 20000 covers it with headroom.
          MAX_BODY=20000

          req() {
            m=$1; p=$2; d=${3:-}
            if [ -n "$d" ]; then
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 120 -X "$m" \
                       -u "$OS_USER:$OS_PASS" -H 'Content-Type: application/json' --data-binary "$d" "$B$p")
            else
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 120 -X "$m" \
                       -u "$OS_USER:$OS_PASS" "$B$p")
            fi
            printf '\n%-44s -> HTTP %s\n' "$m $p" "$code"
            head -c "$MAX_BODY" /tmp/body; echo
          }

          req GET /_cluster/health
          # Shard count is the capacity question. Read heap from the nodes output
          # below rather than assuming an instance size -- dev runs
          # t3.medium.search and production defaults to t3.small.search, so the
          # budget differs by environment. The usual ceiling is ~20-25 shards per
          # GiB of heap; a 2 GiB node is therefore good for roughly 50, and every
          # OpenMetadata index is created with 5 primaries plus a replica. Well
          # past that the cluster times out rather than refusing, which shows up
          # as HTTP 000/504 with no error body. active_shards in the health output
          # is the number to watch.
          req GET "/_cat/health?v"
          req GET "/_cat/nodes?v&h=name,node.role,heap.percent,ram.percent,cpu,load_1m"
          # Doc counts are the direct answer to "are the indices empty?", and
          # store.size shows which indices are worth reclaiming.
          req GET "/_cat/indices?v&h=index,health,pri,rep,docs.count,store.size&s=store.size:desc"
          # Explore reads through the ALIAS (table_search_index and friends), never
          # a concrete index, and _cat/indices does not list aliases -- so a
          # healthy index list with no alias pointing at it looks fine here and
          # still leaves Explore blank. Reindexing writes
          # <entity>_search_index_rebuild_<epoch> and swaps the alias onto it at
          # the end, so during a rebuild two generations coexist and only the
          # alias says which one is live.
          req GET "/_cat/aliases?v&h=alias,index,is_write_index&s=alias:asc"
          # Which OpenSearch user/roles the credentials map to. The FGAC master
          # user should map to all_access; anything else explains read-yes/write-no.
          req GET /_plugins/_security/api/account

          if [ "$MODE" = "write" ]; then
            req GET "/_cat/allocation?v"
            req DELETE /om-auth-probe
            req PUT /om-auth-probe
            req POST "/om-auth-probe/_doc?refresh=true" '{"probe":true}'
            # _bulk is what the search sink actually uses, and it can return
            # HTTP 200 with per-item errors in the body -- hence printing bodies.
            # Command substitution strips trailing newlines, so a bare
            # $(printf '...\n') loses the terminator and OpenSearch rejects the
            # body with "The bulk request must be terminated by a newline".
            # The X sentinel is appended then removed, preserving it.
            #
            # The document field is "via", NOT "probe". The _doc call above puts a
            # boolean in "probe", which dynamic mapping fixes as boolean for the
            # index; sending the string "bulk" in the same field then fails with
            # mapper_parsing_exception and the response reads "errors":true. That is
            # the probe contradicting itself, not a write failure -- and it looked
            # exactly like a broken sink on every previous run.
            BULK=$(printf '{"index":{"_index":"om-auth-probe"}}\n{"via":"bulk"}\nX'); BULK=${BULK%X}
            req POST /_bulk "$BULK"
            req DELETE /om-auth-probe
          fi
          PROBE

          # Named after the pod so `kubectl logs` needs no -c. (It also used to
          # matter because `kubectl run -i` attaches to the container matching the
          # pod name -- see the run block below for why we no longer attach.)
          POD_NAME="om-os-probe-${GITHUB_RUN_ID}"

          OVERRIDES=$(SCRIPT="$SCRIPT" OS_HOST="$OS_HOST" OS_PORT="$OS_PORT" \
                      OS_SCHEME="$OS_SCHEME" OS_USER="$OS_USER" MODE="$MODE" \
                      POD_NAME="$POD_NAME" \
                      python3 - <<'PY'
          import json, os
          env = lambda k: {"name": k, "value": os.environ[k]}
          print(json.dumps({
              "apiVersion": "v1",
              "spec": {
                  "restartPolicy": "Never",
                  "containers": [{
                      "name": os.environ["POD_NAME"],
                      "image": "curlimages/curl:8.11.1",
                      "command": ["sh", "-c", os.environ["SCRIPT"]],
                      "env": [env("OS_HOST"), env("OS_PORT"), env("OS_SCHEME"),
                              env("OS_USER"), env("MODE"),
                              {"name": "OS_PASS", "valueFrom": {"secretKeyRef": {
                                  "name": "opensearch-credentials", "key": "password"}}}],
                  }],
              },
          }))
          PY
          )

          # Run detached and read the log afterwards, rather than `kubectl run -i
          # --rm`. With the attach form the container routinely starts writing
          # before kubectl has established the stream, and the FIRST responses are
          # lost: a real run dropped /_cluster/health, /_cat/health and
          # /_cat/nodes, which is precisely the heap and shard-count evidence this
          # probe exists to collect -- and it fails silently, because what remains
          # looks like a complete log. Detach-then-log returns all of it.
          cleanup() {
            kubectl delete pod -n "$NAMESPACE" "$POD_NAME" \
              --ignore-not-found --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          kubectl run "$POD_NAME" -n "$NAMESPACE" \
            --image=curlimages/curl:8.11.1 --restart=Never \
            --overrides="$OVERRIDES" >/dev/null || true

          # Poll for a terminal phase. `kubectl wait` has no single condition
          # covering both Succeeded and Failed, and the probe output is worth
          # printing either way, so read the phase directly.
          phase=""
          for _ in $(seq 1 90); do          # ~3 minutes
            phase=$(kubectl get pod -n "$NAMESPACE" "$POD_NAME" \
                      -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 2
          done

          out=$(kubectl logs -n "$NAMESPACE" "$POD_NAME" 2>/dev/null || true)
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
          else
            # No output at all means the pod never ran its command -- unschedulable,
            # image pull failure, or a missing opensearch-credentials secret. The
            # events say which; the logs never will.
            echo "::warning::probe pod produced no output (phase=${phase:-unknown})"
            kubectl describe pod -n "$NAMESPACE" "$POD_NAME" 2>&1 | sed -n '/Events:/,$p' || true
          fi

          echo
          echo "Interpretation:"
          echo "  health 200 + non-zero docs.count on *_search_index -> index is populated; Explore should work"
          echo "  health 200, indices present but docs.count 0        -> writes are failing; see the write probe"
          echo "  health 200, PUT/_bulk 403                           -> authorised for reads only; check the account/roles output"
          echo "  cluster_block_exception / read_only_allow_delete    -> disk watermark, not auth; grow volume_size"
          echo "  health 401                                          -> credentials rejected outright"
          echo "  docs present but no alias on <entity>_search_index  -> Explore blank though the data is indexed"
          echo "  two *_rebuild_<epoch> generations for one entity     -> a reindex is mid-flight; the alias names the live one"
          echo "  active_shards far above ~25 per GiB of node heap    -> shard pressure; reduce-replicas helps in dev"

      # Re-points the domain's FGAC master user at the password already held in
      # the opensearch-credentials secret -- which is Terraform's value -- and
      # restarts the server if it holds an older one.
      #
      # Why this drifts: modules/opensearch/main.tf generates the password with
      # random_password and writes it to BOTH the domain and the Kubernetes
      # secret. AWS never returns master_user_password, so Terraform cannot
      # detect that the domain's copy no longer matches -- a plan is clean while
      # every search request is rejected with 401.
      #
      # Sending the secret's value straight to the domain used to be what this
      # did, and AWS frequently accepted it and applied nothing. It now runs
      # scripts/opensearch-credentials.sh heal, which "bounces" the password:
      # a throwaway value first, then the secret's value, asserting that
      # UpdateVersion moves both times, and re-probes afterwards. It only acts
      # if it finds a 401 or a stale pod. deploy.yml runs the same script after
      # every apply, so this action is for drift between applies.
      - name: Reset the OpenSearch master password to match the secret
        if: ${{ github.event.inputs.action == 'reset-opensearch-password' }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${OS_DOMAIN:-}" ]; then
            echo "::error::This environment has no AWS OpenSearch domain (in-cluster via the deps chart)"
            exit 1
          fi
          bash scripts/opensearch-credentials.sh heal

      # Sets a BRAND NEW password on both sides, rather than trying to make one
      # side match the other.
      #
      # Why this exists: `reset-opensearch-password` sent the secret's value to
      # the domain and AWS returned State=Active with an UpdateDate 11 days old
      # -- it changed nothing, and the CLI reported no error. Sending a value
      # AWS cannot regard as unchanged forces the update to be real, and removes
      # any dependence on diagnosing which side was wrong.
      #
      # The generated password satisfies both AWS's complexity rule and the
      # module's YAML-safety constraints (uppercase first character, specials
      # limited to _ - . so it survives being embedded in openmetadata.yaml).
      #
      # NOTE: this diverges from Terraform state, which still holds the old
      # random_password. The next `apply` reverts the SECRET to the state value
      # (Terraform can read a Kubernetes secret) but NOT the domain (it cannot
      # read the master password, so it sees no diff) -- which on its own would
      # leave search broken again. deploy.yml's "Verify search credentials" step
      # catches exactly that and bounces the domain back to the state value.
      # Prefer reset-opensearch-password, which ends on Terraform's value and
      # so creates no divergence at all.
      - name: Rotate the OpenSearch password on both sides
        if: ${{ github.event.inputs.action == 'rotate-opensearch-password' }}
        run: |
          set -euo pipefail
          if [ -z "${OS_DOMAIN:-}" ]; then
            echo "::error::This environment has no AWS OpenSearch domain"
            exit 1
          fi

          NEWPW=$(python3 -c "
          import secrets, string
          body = ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(20))
          print('A' + body + '_a1')")
          echo "::add-mask::$NEWPW"

          OS_USER=$(kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- \
                      sh -c 'printf %s "${ELASTICSEARCH_USER:-admin}"' 2>/dev/null | tr -d '\r"')
          OS_USER=${OS_USER:-admin}

          BEFORE=$(aws opensearch describe-domain-config --domain-name "$OS_DOMAIN" \
                     --region "${{ vars.AWS_REGION }}" \
                     --query 'DomainConfig.AdvancedSecurityOptions.Status.UpdateVersion' --output text)
          echo "master user '$OS_USER', AdvancedSecurityOptions UpdateVersion before: $BEFORE"

          umask 077
          CFG=$(mktemp); trap 'rm -f "$CFG"' EXIT
          OS_DOMAIN="$OS_DOMAIN" OS_USER="$OS_USER" PW="$NEWPW" python3 - > "$CFG" <<'PY'
          import json, os
          print(json.dumps({
              "DomainName": os.environ["OS_DOMAIN"],
              "AdvancedSecurityOptions": {
                  "Enabled": True,
                  "InternalUserDatabaseEnabled": True,
                  "MasterUserOptions": {
                      "MasterUserName": os.environ["OS_USER"],
                      "MasterUserPassword": os.environ["PW"],
                  },
              },
          }))
          PY
          aws opensearch update-domain-config --region "${{ vars.AWS_REGION }}" \
            --cli-input-json "file://$CFG" >/dev/null

          # The whole point: prove the change was real. A no-op leaves
          # UpdateVersion untouched, which is exactly how the previous attempt
          # failed silently.
          AFTER=$(aws opensearch describe-domain-config --domain-name "$OS_DOMAIN" \
                    --region "${{ vars.AWS_REGION }}" \
                    --query 'DomainConfig.AdvancedSecurityOptions.Status.UpdateVersion' --output text)
          echo "UpdateVersion after: $AFTER"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::AWS accepted the call but did not apply it (UpdateVersion unchanged at $BEFORE)."
            echo "The AWS API path cannot set this domain's master password."
            echo "Reset it from OpenSearch Dashboards instead:"
            echo "  Security -> Internal users -> $OS_USER -> Edit -> reset password"
            echo "then re-run this workflow with action=diagnose to confirm."
            exit 1
          fi

          echo "Waiting for the domain to finish processing..."
          for _ in $(seq 1 60); do
            p=$(aws opensearch describe-domain --domain-name "$OS_DOMAIN" \
                  --region "${{ vars.AWS_REGION }}" \
                  --query 'DomainStatus.Processing' --output text)
            [ "$p" = "False" ] && break
            sleep 15
          done

          # Only update the secret once the domain has genuinely taken the new
          # value, so a failed rotation cannot leave the secret ahead of it.
          B64=$(printf %s "$NEWPW" | base64 | tr -d '\n')
          kubectl patch secret opensearch-credentials -n "$NAMESPACE" \
            --type merge -p "{\"data\":{\"password\":\"$B64\"}}"

          # The chart reads the password at container start, so the running pod
          # still holds the previous one until it is replaced.
          kubectl rollout restart "deploy/$RELEASE" -n "$NAMESPACE"
          kubectl rollout status  "deploy/$RELEASE" -n "$NAMESPACE" --timeout=10m

          echo
          echo "Rotated. Re-run with action=test-search-write; expect HTTP 200."
          echo "Terraform state still holds the OLD password: the next apply reverts the"
          echo "secret, and its post-apply check re-aligns the domain. See the note in this step."

      # Sets number_of_replicas = 0 on every non-system index.
      #
      # Why: OpenMetadata creates ~45 indices at 5 primaries + 1 replica each --
      # around 757 shards. A t3.small.search node has roughly 1 GiB of heap and
      # the working guideline is ~20-25 shards per GiB, so the domain is heavily
      # oversubscribed. With one data node unavailable, every replica shard is
      # unassignable: the cluster sits yellow with 366 unassigned shards and
      # ~52% active. Dropping replicas to 0 clears all of them at once and
      # halves the shard load, which is also what keeps knocking the node over.
      #
      # Safe in dev because these indices are DERIVED data -- Search Indexing
      # rebuilds them from the application database. It is not safe where search
      # must survive a node loss, so this refuses to run outside dev.
      #
      # The `-.*` term excludes dot-prefixed system indices
      # (.opendistro_security, .plugins-ml-*, .kibana*): those are managed by
      # OpenSearch itself and must keep their own replica settings.
      #
      # The connection block below mirrors the Probe step rather than sharing a
      # helper. Kept self-contained deliberately: the probe is the one piece of
      # working diagnosis in this file and is not worth refactoring under a live
      # incident.
      - name: Reduce index replicas to 0 (dev only)
        if: ${{ github.event.inputs.action == 'reduce-replicas' }}
        run: |
          set -uo pipefail

          if [ "${{ github.event.inputs.environment }}" != "dev" ]; then
            echo "::error::reduce-replicas is restricted to dev. Removing replicas elsewhere means a single node loss takes search down until a full reindex."
            exit 1
          fi

          dump=$(kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- sh -c '
            echo "H=${ELASTICSEARCH_HOST:-}"
            echo "P=${ELASTICSEARCH_PORT:-443}"
            echo "S=${ELASTICSEARCH_SCHEME:-https}"
            echo "U=${ELASTICSEARCH_USER:-admin}"' 2>/dev/null)
          # The chart double-quotes these; see the Probe step's byte dump.
          strip() { printf %s "$1" | tr -d '\r' | sed -e 's/^"\(.*\)"$/\1/'; }
          OS_HOST=$(strip "$(printf %s "$dump" | sed -n 's/^H=//p')")
          OS_PORT=$(strip "$(printf %s "$dump" | sed -n 's/^P=//p')")
          OS_SCHEME=$(strip "$(printf %s "$dump" | sed -n 's/^S=//p')")
          OS_USER=$(strip "$(printf %s "$dump" | sed -n 's/^U=//p')")
          [ -n "$OS_HOST" ] || { echo "::error::ELASTICSEARCH_HOST empty in the server pod"; exit 1; }
          echo "target: $OS_SCHEME://$OS_HOST:$OS_PORT as $OS_USER"

          read -r -d '' SCRIPT <<'REPLICAS' || true
          set -u
          B="$OS_SCHEME://$OS_HOST:$OS_PORT"
          A="-u $OS_USER:$OS_PASS"

          echo "--- before ---"
          curl -s --max-time 120 $A "$B/_cat/health?v"

          echo
          echo "--- setting number_of_replicas=0 on non-system indices ---"
          curl -s --max-time 180 -X PUT $A \
            -H 'Content-Type: application/json' \
            --data-binary '{"index":{"number_of_replicas":0}}' \
            "$B/*,-.*/_settings?expand_wildcards=open&allow_no_indices=true"
          echo

          echo
          echo "--- after (allow a moment for shards to settle) ---"
          sleep 20
          curl -s --max-time 120 $A "$B/_cat/health?v"
          echo
          curl -s --max-time 120 $A "$B/_cat/indices?v&h=index,health,pri,rep,docs.count,store.size&s=docs.count:desc" \
            | head -60
          REPLICAS

          POD_NAME="om-os-replicas-${GITHUB_RUN_ID}"
          OVERRIDES=$(SCRIPT="$SCRIPT" OS_HOST="$OS_HOST" OS_PORT="$OS_PORT" \
                      OS_SCHEME="$OS_SCHEME" OS_USER="$OS_USER" POD_NAME="$POD_NAME" \
                      python3 - <<'PY'
          import json, os
          env = lambda k: {"name": k, "value": os.environ[k]}
          print(json.dumps({
              "apiVersion": "v1",
              "spec": {
                  "restartPolicy": "Never",
                  "containers": [{
                      "name": os.environ["POD_NAME"],
                      "image": "curlimages/curl:8.11.1",
                      "command": ["sh", "-c", os.environ["SCRIPT"]],
                      "env": [env("OS_HOST"), env("OS_PORT"), env("OS_SCHEME"),
                              env("OS_USER"),
                              {"name": "OS_PASS", "valueFrom": {"secretKeyRef": {
                                  "name": "opensearch-credentials", "key": "password"}}}],
                  }],
              },
          }))
          PY
          )

          kubectl run "$POD_NAME" -n "$NAMESPACE" \
            --image=curlimages/curl:8.11.1 --restart=Never --rm -i --quiet \
            --pod-running-timeout=3m --overrides="$OVERRIDES" || true

          echo
          echo "Expect status=green and unassign=0 in the 'after' block."
          echo "If it is still yellow, the missing data node is the remaining cause;"
          echo "check us-east-1b in the diagnose action's AWS domain health output."

      # Installs a composable index template that gives OpenMetadata's indices
      # 1 primary shard (and 0 replicas in dev, 1 elsewhere), instead of the 5
      # primaries Amazon OpenSearch Service gives an index by default. ~757
      # shards become ~150 with replicas, ~75 without.
      #
      # A template applies only when an index is CREATED -- shard count is
      # immutable afterwards. Nothing changes for existing indices until
      # OpenMetadata rebuilds them: Settings -> Applications -> Search Indexing
      # -> Recreate Index = true -> Run. Re-run this action afterwards; it is
      # idempotent, and its index table should then show pri=1.
      #
      # If pri is still 5 after a rebuild, OpenMetadata is setting the shard
      # count explicitly in its create-index request, which beats any template.
      # The fallback is the _shrink API per index; see README_full.md.
      #
      # Composable templates do NOT merge: only the highest-priority match
      # applies to an index. A template of ours that overlapped one OpenMetadata
      # or OpenSearch already owns (data streams such as di-data-assets-* depend
      # on theirs) would silently replace it. So this refuses, before writing
      # anything, if any existing template could match the same names.
      #
      # Two pods rather than one: the curl image has no jq or python, so the
      # pods only fetch and print, and every decision is made here on the
      # runner. Phase 1 is read-only; phase 2 writes only if phase 1 passed.
      - name: Set shard template
        if: ${{ github.event.inputs.action == 'set-shard-template' }}
        env:
          TEMPLATE_NAME: openmetadata-shards
          # OpenMetadata's entity and report indices, with or without its
          # clusterAlias prefix. Dot-prefixed system indices never match.
          TEMPLATE_PATTERNS: "*_search_index *_report_data_index"
        run: |
          set -uo pipefail
          ENV_NAME="${{ github.event.inputs.environment }}"
          # Dev runs without replicas (see reduce-replicas); anywhere else
          # search has to survive a node loss.
          if [ "$ENV_NAME" = "dev" ]; then REPLICAS=0; else REPLICAS=1; fi
          export TEMPLATE_NAME TEMPLATE_PATTERNS REPLICAS

          dump=$(kubectl exec -n "$NAMESPACE" "deploy/$RELEASE" -- sh -c '
            echo "H=${ELASTICSEARCH_HOST:-}"
            echo "P=${ELASTICSEARCH_PORT:-443}"
            echo "S=${ELASTICSEARCH_SCHEME:-https}"
            echo "U=${ELASTICSEARCH_USER:-admin}"' 2>/dev/null)
          # The chart double-quotes these; see the Probe step's byte dump.
          strip() { printf %s "$1" | tr -d '\r' | sed -e 's/^"\(.*\)"$/\1/'; }
          OS_HOST=$(strip "$(printf %s "$dump" | sed -n 's/^H=//p')")
          OS_PORT=$(strip "$(printf %s "$dump" | sed -n 's/^P=//p')")
          OS_SCHEME=$(strip "$(printf %s "$dump" | sed -n 's/^S=//p')")
          OS_USER=$(strip "$(printf %s "$dump" | sed -n 's/^U=//p')")
          [ -n "$OS_HOST" ] || { echo "::error::ELASTICSEARCH_HOST empty in the server pod"; exit 1; }
          echo "target: $OS_SCHEME://$OS_HOST:$OS_PORT as $OS_USER"
          echo "template: $TEMPLATE_NAME  patterns: $TEMPLATE_PATTERNS  shards: 1  replicas: $REPLICAS"
          export OS_HOST OS_PORT OS_SCHEME OS_USER

          # Runs SCRIPT in a throwaway curl pod: same nodes, so the same node
          # security group faces the VPC-only domain, with the password from
          # the secret by secretKeyRef so it never lands in a pod spec or log.
          # Extra env vars named in $3 are passed through.
          os_pod() {
            local name="$1" script="$2" extra="${3:-}"
            local overrides
            overrides=$(SCRIPT="$script" POD_NAME="$name" EXTRA="$extra" python3 - <<'PY'
          import json, os
          env = lambda k: {"name": k, "value": os.environ[k]}
          names = ["OS_HOST", "OS_PORT", "OS_SCHEME", "OS_USER"] + os.environ["EXTRA"].split()
          print(json.dumps({
              "apiVersion": "v1",
              "spec": {
                  "restartPolicy": "Never",
                  "containers": [{
                      "name": os.environ["POD_NAME"],
                      "image": "curlimages/curl:8.11.1",
                      "command": ["sh", "-c", os.environ["SCRIPT"]],
                      "env": [env(k) for k in names] + [
                          {"name": "OS_PASS", "valueFrom": {"secretKeyRef": {
                              "name": "opensearch-credentials", "key": "password"}}}],
                  }],
              },
          }))
          PY
            )
            kubectl run "$name" -n "$NAMESPACE" \
              --image=curlimages/curl:8.11.1 --restart=Never --rm -i --quiet \
              --pod-running-timeout=3m --overrides="$overrides"
          }

          # --- phase 1: read-only --------------------------------------------
          read -r -d '' READ_SCRIPT <<'READ' || true
          set -u
          B="$OS_SCHEME://$OS_HOST:$OS_PORT"
          A="-u $OS_USER:$OS_PASS"
          for part in "HEALTH _cluster/health" \
                      "TEMPLATES _index_template" \
                      "INDICES _cat/indices?format=json&h=index,pri,rep,docs.count&expand_wildcards=open" \
                      "STREAMS _data_stream"; do
            set -- $part
            echo "@@$1@@"
            curl -s --max-time 120 $A "$B/$2"
            echo
            echo "@@END@@"
          done
          READ

          os_pod "om-os-shards-read-${GITHUB_RUN_ID}" "$READ_SCRIPT" > phase1.txt
          rc=$?
          [ $rc -eq 0 ] || { cat phase1.txt; echo "::error::read phase failed (exit $rc)"; exit 1; }

          python3 - <<'PY' || exit 1
          import fnmatch, json, os, re, sys

          raw = open("phase1.txt").read()
          parts = dict(re.findall(r"@@(\w+)@@\n(.*?)\n@@END@@", raw, re.S))
          def load(k):
              try:
                  return json.loads(parts[k])
              except Exception:
                  print(raw[-3000:])
                  print(f"::error::could not read {k} from OpenSearch -- see the output above")
                  sys.exit(1)

          health, templates, indices, streams = (load(k) for k in ("HEALTH", "TEMPLATES", "INDICES", "STREAMS"))
          if "error" in templates or isinstance(indices, dict):
              print(json.dumps(templates)[:1500], json.dumps(indices)[:1500])
              print("::error::OpenSearch refused a read -- run test-search-write to classify it")
              sys.exit(1)

          name = os.environ["TEMPLATE_NAME"]
          ours = os.environ["TEMPLATE_PATTERNS"].split()
          replicas = int(os.environ["REPLICAS"])
          print(f"cluster status: {health.get('status')}  active shards: {health.get('active_shards')}  "
                f"unassigned: {health.get('unassigned_shards')}")

          # Names that exist now: open indices plus data streams.
          live = [i["index"] for i in indices] + [s["name"] for s in streams.get("data_streams", [])]
          def matches(n, pats):
              return any(fnmatch.fnmatchcase(n, p) for p in pats)

          # Overlap with any template we do not own. Pattern against pattern is
          # checked both ways (a literal reading of one against the other
          # catches "*" and prefix catch-alls); real names catch the rest.
          conflicts = []
          for t in templates.get("index_templates", []):
              if t["name"] == name:
                  continue
              theirs = t["index_template"].get("index_patterns", [])
              why = [f"{tp} ~ {op}" for tp in theirs for op in ours
                     if fnmatch.fnmatchcase(tp, op) or fnmatch.fnmatchcase(op, tp)]
              why += [f"both match {n}" for n in live if matches(n, theirs) and matches(n, ours)]
              if why:
                  conflicts.append((t["name"], theirs, why[:5]))
          if conflicts:
              print("\nRefusing: these existing templates could match the same names, and only")
              print("one composable template applies per index -- ours would replace theirs.\n")
              for n, pats, why in conflicts:
                  print(f"  {n}  patterns={pats}")
                  for w in why:
                      print(f"      {w}")
              print("\n::error::template patterns overlap an existing template; nothing was written. "
                    "Narrow TEMPLATE_PATTERNS in this step to exclude those names.")
              sys.exit(1)
          print("no overlapping templates")

          # What the template will cover, and what the rebuild should save.
          user = [i for i in indices if not i["index"].startswith(".")]
          covered = [i for i in user if matches(i["index"], ours)]
          missed = [i for i in user if not matches(i["index"], ours)]
          now = sum(int(i["pri"]) * (1 + int(i["rep"])) for i in covered)
          after = len(covered) * (1 + replicas)
          print(f"\n{len(covered)} OpenMetadata indices covered: {now} shards now, {after} after a rebuild")
          print(f"{'index':<55} {'pri':>4} {'rep':>4} {'docs':>10}")
          for i in sorted(covered, key=lambda i: i["index"]):
              print(f"{i['index']:<55} {i['pri']:>4} {i['rep']:>4} {i['docs.count'] or 0:>10}")
          if missed:
              print("\nNOT covered by the patterns (left as they are):")
              for i in missed:
                  print(f"  {i['index']}  pri={i['pri']} rep={i['rep']}")

          body = {"index_patterns": ours, "priority": 10,
                  "template": {"settings": {"number_of_shards": 1, "number_of_replicas": replicas}},
                  "_meta": {"managed_by": "openmetadata-ops set-shard-template"}}
          open("template.json", "w").write(json.dumps(body))
          PY

          # --- phase 2: write, then prove what a new index would get ----------
          export TEMPLATE_BODY="$(cat template.json)"
          read -r -d '' WRITE_SCRIPT <<'WRITE' || true
          set -u
          B="$OS_SCHEME://$OS_HOST:$OS_PORT"
          A="-u $OS_USER:$OS_PASS"
          echo "@@PUT@@"
          curl -s --max-time 120 -X PUT $A -H 'Content-Type: application/json' \
            --data-binary "$TEMPLATE_BODY" "$B/_index_template/$TEMPLATE_NAME"
          echo
          echo "@@END@@"
          # Simulated names that match each pattern, so this checks the
          # template as OpenSearch resolves it without creating anything.
          for n in zz_shardcheck_search_index zz_shardcheck_report_data_index; do
            echo "@@SIM@@"
            curl -s --max-time 120 -X POST $A "$B/_index_template/_simulate_index/$n"
            echo
            echo "@@END@@"
          done
          WRITE

          os_pod "om-os-shards-write-${GITHUB_RUN_ID}" "$WRITE_SCRIPT" "TEMPLATE_BODY TEMPLATE_NAME" > phase2.txt
          rc=$?
          [ $rc -eq 0 ] || { cat phase2.txt; echo "::error::write phase failed (exit $rc)"; exit 1; }

          python3 - <<'PY' || exit 1
          import json, os, re, sys
          raw = open("phase2.txt").read()
          blocks = re.findall(r"@@(\w+)@@\n(.*?)\n@@END@@", raw, re.S)
          put = json.loads(dict(blocks)["PUT"])
          if not put.get("acknowledged"):
              print(json.dumps(put, indent=2)[:3000])
              print("::error::OpenSearch did not accept the template")
              sys.exit(1)
          print(f"template {os.environ['TEMPLATE_NAME']} accepted")
          want = ("1", os.environ["REPLICAS"])
          ok = True
          for kind, body in blocks:
              if kind != "SIM":
                  continue
              sim = json.loads(body)
              idx = sim.get("template", {}).get("settings", {}).get("index", {})
              got = (str(idx.get("number_of_shards")), str(idx.get("number_of_replicas")))
              applied = [o.get("name") for o in sim.get("overlapping", [])]
              print(f"  a new matching index would get shards={got[0]} replicas={got[1]}"
                    + (f"  (overlapping, not applied: {applied})" if applied else ""))
              ok &= got == want
          if not ok:
              print("::error::the simulated settings do not match the template -- another template wins")
              sys.exit(1)
          PY

          echo
          echo "Done. Existing indices are unchanged until OpenMetadata rebuilds them:"
          echo "  Settings -> Applications -> Search Indexing -> Configure -> Recreate Index = true -> Run"
          echo "Wait for the cluster to be green first. Then re-run this action: the index"
          echo "table should show pri=1. If it still shows 5, OpenMetadata sets the shard"
          echo "count itself and the template cannot override it -- see README_full.md."

      # Everything about how the UI is published, in one read-only run: the
      # Service the controller reconciles, the load balancer it produced, the
      # listeners and certificate, target health, the security group rules
      # actually in force, and any matching Route 53 record.
      #
      # Written for the "I cannot reach the URL" case, where the answer is
      # usually one of: wrong scheme, no listener on the port being tried, a
      # source range that does not match the address the load balancer actually
      # sees, only some AZs routed, or DNS pointing at a load balancer that has
      # since been replaced.
      #
      # Note ICMP is never the test: an NLB does not answer ping, and the
      # controller-managed security group opens only the listener ports. A
      # timed-out ping against a perfectly healthy NLB is the expected result.
      - name: Show exposure
        if: ${{ github.event.inputs.action == 'show-exposure' }}
        run: |
          set -uo pipefail
          R="${{ vars.AWS_REGION }}"

          echo "::group::Declared in $TFVARS_FILE"
          grep -nE '^[[:space:]]*(app_expose_via_alb|app_accelerator_arn|app_lb_scheme|app_lb_allowed_cidrs|app_tls_domain_name|app_tls_route53_zone_name|app_tls_certificate_arn|app_waf_enabled|app_waf_rate_limit|app_waf_rate_limit_action)' \
            "$TFVARS_FILE" || echo "(no exposure variables set -- UI is ClusterIP + port-forward only)"
          echo "::endgroup::"

          # An Ingress, not a Service: the controller provisions ALBs from
          # Ingresses. The allowlist lives in the inbound-cidrs ANNOTATION
          # rather than spec.loadBalancerSourceRanges, so the annotation dump
          # below is where to read it.
          echo "::group::Ingress openmetadata-public (what the controller reconciles)"
          kubectl get ingress -n "$NAMESPACE" openmetadata-public -o wide 2>/dev/null \
            || echo "Ingress not found -- app_expose_via_alb is probably false"
          kubectl get ingress -n "$NAMESPACE" openmetadata-public -o json 2>/dev/null | python3 -c '
          import json, sys
          try: d = json.load(sys.stdin)
          except Exception: sys.exit(0)
          print("\nannotations:")
          for k, v in sorted((d["metadata"].get("annotations") or {}).items()):
              print(f"  {k} = {v}")
          sp = d.get("spec", {})
          print("\ningressClassName:", sp.get("ingressClassName"))
          backends = []
          for r in sp.get("rules", []):
              for pth in ((r.get("http") or {}).get("paths") or []):
                  svc = ((pth.get("backend") or {}).get("service") or {})
                  backends.append((pth.get("path"), svc.get("name"), (svc.get("port") or {}).get("number")))
          print("rules (path, service, port):", backends)
          ing = (d.get("status", {}).get("loadBalancer", {}) or {}).get("ingress") or []
          print("status hostname:", [i.get("hostname") or i.get("ip") for i in ing])'
          echo "::endgroup::"

          # Warning events are where controller rejections land -- a malformed
          # inbound-cidrs entry, an unresolvable subnet, or a duplicate load
          # balancer name. None of them fail the Ingress object itself, so
          # without this they are invisible.
          echo "::group::Ingress events (controller rejections surface only here)"
          kubectl describe ingress -n "$NAMESPACE" openmetadata-public 2>/dev/null \
            | sed -n '/Events:/,$p' || echo "(no Ingress)"
          echo "::endgroup::"

          # Scope to load balancers this cluster owns, by the tag the controller
          # stamps on everything it provisions. Avoids picking up unrelated load
          # balancers in the same account.
          for arn in $(aws elbv2 describe-load-balancers --region "$R" \
                         --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null); do
            owner=$(aws elbv2 describe-tags --resource-arns "$arn" --region "$R" \
                      --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value" \
                      --output text 2>/dev/null)
            [ "$owner" = "$CLUSTER" ] || continue

            name=$(aws elbv2 describe-load-balancers --load-balancer-arns "$arn" --region "$R" \
                     --query 'LoadBalancers[0].LoadBalancerName' --output text)
            echo "::group::Load balancer $name"

            # Per-AZ private addresses matter: an internal NLB has one address
            # per AZ and DNS hands them out in rotation, so a VPN that routes
            # only one of the private subnets black-holes half the attempts.
            aws elbv2 describe-load-balancers --load-balancer-arns "$arn" --region "$R" \
              --query 'LoadBalancers[].{Name:LoadBalancerName,Type:Type,Scheme:Scheme,State:State.Code,DNS:DNSName,Zones:AvailabilityZones[].{Zone:ZoneName,Subnet:SubnetId,Addrs:LoadBalancerAddresses[].[PrivateIPv4Address,IpAddress]}}' \
              --output json

            # LoadBalancerAddresses is frequently EMPTY for an internal NLB whose
            # addresses were not explicitly assigned, so read them from the
            # ENIs instead -- these are the addresses clients actually connect to,
            # one per AZ, handed out by DNS in rotation.
            echo "-- actual addresses, from the ENIs --"
            aws ec2 describe-network-interfaces --region "$R" \
              --filters "Name=description,Values=ELB net/$name/*" \
              --query 'NetworkInterfaces[].{AZ:AvailabilityZone,Subnet:SubnetId,Private:PrivateIpAddress,Public:Association.PublicIp}' \
              --output table || true

            echo "-- listeners (a port with no listener times out) --"
            aws elbv2 describe-listeners --load-balancer-arn "$arn" --region "$R" \
              --query 'Listeners[].{Port:Port,Protocol:Protocol,Cert:Certificates[0].CertificateArn}' \
              --output table || true

            echo "-- security group rules actually in force --"
            for sg in $(aws elbv2 describe-load-balancers --load-balancer-arns "$arn" --region "$R" \
                          --query 'LoadBalancers[].SecurityGroups[]' --output text 2>/dev/null); do
              echo "   $sg"
              aws ec2 describe-security-groups --group-ids "$sg" --region "$R" \
                --query 'SecurityGroups[].IpPermissions[].{From:FromPort,To:ToPort,Proto:IpProtocol,Cidrs:IpRanges[].CidrIp}' \
                --output json || true
            done

            echo "-- target health (unhealthy targets also present as timeouts) --"
            for tg in $(aws elbv2 describe-target-groups --load-balancer-arn "$arn" --region "$R" \
                          --query 'TargetGroups[].TargetGroupArn' --output text 2>/dev/null); do
              aws elbv2 describe-target-health --target-group-arn "$tg" --region "$R" \
                --query 'TargetHealthDescriptions[].{Id:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason}' \
                --output table || true
            done

            echo "-- certificates on the listeners --"
            for c in $(aws elbv2 describe-listeners --load-balancer-arn "$arn" --region "$R" \
                         --query 'Listeners[].Certificates[].CertificateArn' --output text 2>/dev/null | tr '\t' '\n' | sort -u); do
              # SubjectAlternativeNames is the field browsers enforce; CN is
              # ignored. NotAfter matters because IMPORTED certificates do not
              # auto-renew and nothing here will warn you.
              aws acm describe-certificate --certificate-arn "$c" --region "$R" \
                --query 'Certificate.{Domain:DomainName,SANs:SubjectAlternativeNames,Status:Status,Type:Type,NotAfter:NotAfter,InUseBy:InUseBy}' \
                --output json || true
            done
            echo "::endgroup::"
          done

          # Global Accelerator, when one is in front. Its control plane is
          # reachable only through the us-west-2 endpoint, whatever region the
          # endpoints live in -- a describe against us-east-1 returns nothing
          # and reads as "no accelerator".
          echo "::group::Global Accelerator"
          # The accelerator is owned by bootstrap/, not by this environment, so
          # it is identified from the tfvars rather than from the cluster name.
          # By ARN, matching what the environment stack itself consumes -- a
          # name lookup leaves the data source's `arn` null and breaks the
          # listener, so the tfvars carries the ARN.
          ACCS=$(grep -E '^[[:space:]]*app_accelerator_arn' "$TFVARS_FILE" | head -1 | cut -d'"' -f2)
          if [ -z "$ACCS" ]; then
            echo "(app_accelerator_arn is unset -- no accelerator in front of this environment)"
          else
            echo "accelerator ARN from $TFVARS_FILE: $ACCS"
            if ! aws globalaccelerator describe-accelerator --region us-west-2 \
                   --accelerator-arn "$ACCS" >/dev/null 2>&1; then
              echo "NOT FOUND: that ARN does not resolve."
              echo "bootstrap/ has probably not been applied with create_global_accelerator = true,"
              echo "or the ARN is stale -- the environment plan fails the same way. Current ARNs:"
              aws globalaccelerator list-accelerators --region us-west-2 \
                --query 'Accelerators[].{Name:Name,Arn:AcceleratorArn}' --output table 2>/dev/null || true
              ACCS=""
            fi
          fi
          for a in $ACCS; do
            aws globalaccelerator describe-accelerator --region us-west-2 --accelerator-arn "$a" \
              --query 'Accelerator.{Name:Name,Status:Status,Enabled:Enabled,DNS:DnsName,StaticIPs:IpSets[].IpAddresses[]}' \
              --output json || true

            for l in $(aws globalaccelerator list-listeners --region us-west-2 --accelerator-arn "$a" \
                         --query 'Listeners[].ListenerArn' --output text 2>/dev/null); do
              echo "-- listener: a port absent here is NOT forwarded, and presents as a hang --"
              aws globalaccelerator describe-listener --region us-west-2 --listener-arn "$l" \
                --query 'Listener.{Protocol:Protocol,ClientAffinity:ClientAffinity,Ports:PortRanges}' \
                --output json || true

              # ClientIPPreservationEnabled is the one to read carefully. False
              # means the ALB sees the accelerator's addresses instead of the
              # client's, so app_lb_allowed_cidrs matches nothing and stops
              # limiting access at all -- with no error anywhere.
              echo "-- endpoints: Preserve=false silently voids app_lb_allowed_cidrs --"
              aws globalaccelerator list-endpoint-groups --region us-west-2 --listener-arn "$l" \
                --query 'EndpointGroups[].{Region:EndpointGroupRegion,Endpoints:EndpointDescriptions[].{Id:EndpointId,Health:HealthState,Preserve:ClientIPPreservationEnabled}}' \
                --output json || true
            done
          done
          echo "::endgroup::"

          # An internal ALB is only reachable from inside the VPC or from a
          # network routed to it. A corporate VPN (GlobalProtect and friends)
          # puts the client on the CORPORATE network -- that is not the VPC.
          # Without a Site-to-Site VPN, Direct Connect, Transit Gateway or
          # peering carrying 172.72.0.0/16, packets never arrive, and no
          # security-group entry can help because there is nothing to permit.
          echo "::group::Is anything routed into this VPC?"
          VPC=$(aws ec2 describe-vpcs --region "$R" \
                  --filters "Name=tag:Name,Values=*${CLUSTER}*" \
                  --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          echo "VPC: ${VPC:-<not found by name tag>}"

          echo "-- Site-to-Site VPN connections --"
          aws ec2 describe-vpn-connections --region "$R" \
            --query 'VpnConnections[].{Id:VpnConnectionId,State:State,VpcOrTgw:join(`/`,[VpnGatewayId||`-`,TransitGatewayId||`-`]),Routes:Routes[].DestinationCidrBlock}' \
            --output json || true

          echo "-- Transit Gateway attachments --"
          aws ec2 describe-transit-gateway-attachments --region "$R" \
            --query 'TransitGatewayAttachments[].{Id:TransitGatewayAttachmentId,Type:ResourceType,Resource:ResourceId,State:State}' \
            --output table || true

          echo "-- VPC peering --"
          aws ec2 describe-vpc-peering-connections --region "$R" \
            --query 'VpcPeeringConnections[].{Id:VpcPeeringConnectionId,Status:Status.Code,Requester:RequesterVpcInfo.CidrBlock,Accepter:AccepterVpcInfo.CidrBlock}' \
            --output table || true

          echo "-- Direct Connect --"
          aws directconnect describe-connections --region "$R" \
            --query 'connections[].{Id:connectionId,State:connectionState,Location:location}' \
            --output table 2>/dev/null || echo "(none, or no permission)"

          # The decisive check: the private subnets' route tables. Only a
          # default route to a NAT gateway means egress-only -- nothing inbound
          # from on-prem. A vgw-/tgw-/pcx- target is what makes internal
          # reachable.
          echo "-- route tables for the load balancer's subnets --"
          for sn in $(aws elbv2 describe-load-balancers --region "$R" \
                        --query 'LoadBalancers[].AvailabilityZones[].SubnetId' --output text 2>/dev/null | tr '\t' '\n' | sort -u); do
            echo "   subnet $sn"
            aws ec2 describe-route-tables --region "$R" \
              --filters "Name=association.subnet-id,Values=$sn" \
              --query 'RouteTables[].Routes[].{Dest:DestinationCidrBlock,NAT:NatGatewayId,GW:GatewayId,TGW:TransitGatewayId,VGW:VpcPeeringConnectionId}' \
              --output table || true
          done
          echo "::endgroup::"

          echo "::group::Route 53 records that look related"
          # Best effort, and only meaningful for a zone hosted here. A domain in
          # an internal zone will show nothing -- that is expected, not a fault.
          dom=$(grep -E '^[[:space:]]*app_tls_domain_name' "$TFVARS_FILE" | head -1 | cut -d'"' -f2)
          needle="${dom:-openmetadata}"
          echo "searching for: $needle"
          for z in $(aws route53 list-hosted-zones --query 'HostedZones[].Id' --output text 2>/dev/null); do
            out=$(aws route53 list-resource-record-sets --hosted-zone-id "$z" \
                    --query "ResourceRecordSets[?contains(Name,'${needle%%.*}')].{Name:Name,Type:Type,Alias:AliasTarget.DNSName,Values:ResourceRecords[].Value}" \
                    --output json 2>/dev/null)
            [ "$out" = "[]" ] || { echo "zone $z:"; echo "$out"; }
          done
          echo "::endgroup::"

          echo
          echo "Reading this:"
          echo "  Scheme internal  -> no public address; clients need VPN/DirectConnect/TGW into the VPC"
          echo "  No listener on the port you are trying -> connection times out; check the cert annotation applied"
          echo "  Source-range CIDRs must match the address the LB SEES, which behind a VPN or proxy is its NAT address, not the workstation's"
          echo "  One address per AZ -> if only one private subnet is routed, roughly half of attempts black-hole"
          echo "  A cert SAN that omits the FQDN fails TLS, not TCP -- that shows as a certificate error, never a timeout"
          echo "  ping is not a test: a load balancer does not answer ICMP. Use: nc -vz <fqdn> 443"
          echo
          echo "  With an accelerator in front:"
          echo "    Preserve=false on an endpoint -> app_lb_allowed_cidrs is no longer limiting anything"
          echo "    A DNS record pointing at the ALB hostname resolves and works, but BYPASSES the accelerator"
          echo "    Static IPs belong to the bootstrap-owned accelerator, so they survive an environment destroy"
          echo "    An accelerator with a listener but no endpoint group is a torn-down environment, not a fault"
          echo
          echo "  And rule out the client before AWS: a forward proxy (Netskope) terminates TLS"
          echo "  itself, so a completed handshake proves nothing about reachability. Compare"
          echo "  proxy-on against proxy-off, and check whose certificate you were served."

      - name: Restart the OpenMetadata server
        if: ${{ github.event.inputs.action == 'restart-server' || github.event.inputs.action == 'diagnose-and-restart' }}
        run: |
          set -euo pipefail
          kubectl rollout restart "deploy/$RELEASE" -n "$NAMESPACE"
          kubectl rollout status  "deploy/$RELEASE" -n "$NAMESPACE" --timeout=10m

      - name: What to do next
        if: ${{ github.event.inputs.action == 'diagnose-and-restart' }}
        run: |
          # Deliberately no curl here: the server image has none, and the
          # earlier version of this step silently exited 0, which read as a
          # pass. Re-run the workflow with action=test-search-write to re-probe
          # through the throwaway curl pod.
          echo "Server restarted. Re-run this workflow with action=test-search-write to re-probe."
          echo
          echo "If the probe returns 200, re-run Search Indexing from the UI:"
          echo "  Settings -> Applications -> Search Indexing -> Configure"
          echo "  (Recreate Index = true, all entity types) -> Run"
          echo "Entities are already in the application database, so ingestion does not need re-running."
