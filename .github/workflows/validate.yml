name: validate

# Cloud-free checks on pull requests: confirms the in-repo Terraform project
# formats, initialises and validates. No AWS credentials needed.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "config/**"
      - "backend.tf"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "config/**"
      - "backend.tf"
      - ".github/**"

permissions:
  contents: read

env:
  TF_DIR: terraform
  TF_VERSION: "1.15.8"

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      # Mirrors what deploy.yml injects, so validate exercises the same file
      # layout. dev is used as the representative environment.
      - name: Inject tfvars (dev as representative)
        run: |
          set -euo pipefail
          cp "config/dev.auto.tfvars" "${TF_DIR}/deploy.auto.tfvars"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check env tfvars parse (advisory)
        run: terraform fmt -check -recursive config || echo "::warning::config/*.auto.tfvars not canonically formatted (run 'terraform fmt config')"

      - name: Terraform fmt (advisory)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive || echo "::warning::Terraform files are not canonically formatted"

      # No backend.tf is injected here, so this initialises with local state and
      # needs no bucket or credentials -- it still downloads the providers and
      # registry modules the config pins, which is what validate checks against.
      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate
