name: openmetadata-infra

# Deploys OpenMetadata on AWS (with VPC creation) from the Terraform project
# committed in this repo at terraform/.
#
# Pick an environment (dev / production) and an action (plan / apply / destroy).
# Each environment has its own tfvars, its own state file, and its own approval
# gate. `plan` is never gated; `apply`/`destroy` inherit the selected GitHub
# Environment's protection rules (configure reviewers on "production"; leave
# "dev" unprotected for friction-free create/tear-down).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - production
        default: dev
      action:
        description: Terraform action to run
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

concurrency:
  group: openmetadata-infra-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  # Terraform root module, committed in this repo. Provider and module versions
  # are pinned in terraform/versions.tf and the ebs/efs driver files, so no
  # run-time patching is needed.
  TF_DIR: terraform
  # >= 1.10 required for S3 native state locking (use_lockfile)
  TF_VERSION: "1.15.8"
  # Files injected into TF_DIR (paths relative to the repo root)
  BACKEND_FILE: backend.tf
  # Per-environment config + isolated state key
  TFVARS_FILE: config/${{ github.event.inputs.environment }}.auto.tfvars
  STATE_KEY: ${{ vars.TF_STATE_PREFIX || 'openmetadata' }}/${{ github.event.inputs.environment }}/terraform.tfstate

jobs:
  plan:
    name: Plan (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      - name: Prepare Terraform
        uses: ./.github/actions/prepare
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ env.STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}
          terraform-dir: ${{ env.TF_DIR }}
          backend-file: ${{ env.BACKEND_FILE }}
          tfvars-file: ${{ env.TFVARS_FILE }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (advisory)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive || echo "::warning::Terraform files are not canonically formatted"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply (${{ github.event.inputs.environment }})
    if: ${{ github.event.inputs.action == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # dev = unprotected, production = reviewers
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      - name: Prepare Terraform
        uses: ./.github/actions/prepare
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ env.STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}
          terraform-dir: ${{ env.TF_DIR }}
          backend-file: ${{ env.BACKEND_FILE }}
          tfvars-file: ${{ env.TFVARS_FILE }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Output kubeconfig command
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -raw update_kubeconfig

      # Report where the UI is, in the job summary as well as the log.
      #
      # With TLS configured the URL is known at apply time. Without it, the NLB
      # is created by the AWS Load Balancer Controller *after* Terraform
      # returns -- the upstream helm_release sets wait = false -- so the
      # hostname does not exist yet and has to be polled for. The controller
      # tags the load balancer with elbv2.k8s.aws/cluster, which is how we find
      # it without needing cluster credentials.
      #
      # Never fails the job: the apply already succeeded, and not knowing the
      # hostname yet is not a deployment failure.
      - name: Report UI URL
        if: success()
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -uo pipefail

          url=$(terraform output -raw app_url 2>/dev/null || true)
          exposed=$(terraform output -raw app_expose_via_nlb 2>/dev/null || echo "false")
          cluster=$(terraform output -raw eks_cluster_name 2>/dev/null || true)
          ns=$(terraform output -raw app_namespace 2>/dev/null || echo "openmetadata")

          if [ -z "$url" ] && [ "$exposed" = "true" ] && [ -n "$cluster" ]; then
            echo "Waiting for the load balancer controller to provision the NLB..."
            for _ in $(seq 1 30); do          # up to 5 minutes
              arn=$(aws resourcegroupstaggingapi get-resources \
                      --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$cluster" \
                      --resource-type-filters elasticloadbalancing:loadbalancer \
                      --query 'ResourceTagMappingList[0].ResourceARN' \
                      --output text 2>/dev/null || true)
              if [ -n "$arn" ] && [ "$arn" != "None" ]; then
                host=$(aws elbv2 describe-load-balancers --load-balancer-arns "$arn" \
                        --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || true)
                if [ -n "$host" ] && [ "$host" != "None" ]; then
                  url="http://${host}:8585"
                  break
                fi
              fi
              sleep 10
            done
          fi

          {
            echo "## OpenMetadata — ${{ github.event.inputs.environment }}"
            echo
            if [ -n "$url" ]; then
              echo "**UI:** $url"
              echo
              case "$url" in
                http://*)
                  echo "> Served over plain HTTP and reachable only from the allowlisted CIDRs."
                  echo "> Change the default admin password over \`kubectl port-forward\`, not this URL."
                  ;;
              esac
              echo
              echo "Login: \`admin@open-metadata.org\` / \`admin\` — change it immediately."
              echo
              echo "First boot runs database migrations and builds search indexes, so"
              echo "503s for a few minutes are normal."
            elif [ "$exposed" = "true" ]; then
              echo "The NLB was not ready within 5 minutes. Find it with:"
              echo
              echo '```bash'
              echo "kubectl get svc -n $ns openmetadata -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'"
              echo '```'
            else
              echo "Not published externally (\`app_expose_via_nlb = false\`). Reach it with:"
              echo
              echo '```bash'
              echo "kubectl port-forward -n $ns svc/openmetadata 8585:8585   # then http://localhost:8585"
              echo '```'
            fi
            echo
            echo "**kubeconfig:** \`$(terraform output -raw update_kubeconfig)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    if: ${{ github.event.inputs.action == 'destroy' }}
    # Must wait for the plan job. The plan job runs for EVERY action (including
    # destroy, where it produces the -destroy plan), and both jobs take the same
    # S3 state lock. Without this they start together and the loser fails with:
    #   Error acquiring the state lock ... PreconditionFailed
    # Waiting also means a destroy only proceeds if its plan succeeded.
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # same gate as apply
    steps:
      - name: Check out infra project
        uses: actions/checkout@v4

      - name: Prepare Terraform
        uses: ./.github/actions/prepare
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ env.STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}
          terraform-dir: ${{ env.TF_DIR }}
          backend-file: ${{ env.BACKEND_FILE }}
          tfvars-file: ${{ env.TFVARS_FILE }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -auto-approve
