name: Prepare OpenMetadata Terraform
description: >-
  Inject the backend and environment tfvars into the in-repo Terraform project,
  assume the AWS role via OIDC, and run terraform init.

inputs:
  role-arn:
    description: IAM role ARN to assume via GitHub OIDC
    required: true
  aws-region:
    description: AWS region for the AWS CLI / provider
    required: true
  state-bucket:
    description: S3 bucket holding Terraform state
    required: true
  state-key:
    description: S3 key (path) for the state file
    required: true
  state-region:
    description: Region of the state bucket
    required: true
  terraform-dir:
    description: Path (in this repo) to the Terraform root module to deploy
    required: true
  backend-file:
    description: Path (in this repo) to backend.tf to inject
    required: true
  tfvars-file:
    description: Path (in this repo) to the .auto.tfvars to inject for this environment
    required: true
  terraform-version:
    description: Terraform version to install (>= 1.10 for S3 native locking)
    required: false
    default: "1.15.8"

runs:
  using: composite
  steps:
    # The Terraform project lives in this repo, so there is nothing to check out
    # and nothing to patch -- the config is already consistent with the provider
    # and module versions it pins. Only two environment-specific files are
    # injected: the backend (values supplied at init time) and the tfvars.
    #
    # backend.tf is injected rather than committed inside terraform-dir so the
    # same directory stays usable locally with local state (plain `terraform
    # plan` with no S3 bucket or credentials).
    - name: Inject backend + tfvars into the Terraform project
      shell: bash
      run: |
        set -euo pipefail
        test -d "${{ inputs.terraform-dir }}" || { echo "::error::terraform dir not found: ${{ inputs.terraform-dir }}"; exit 1; }
        test -f "${{ inputs.backend-file }}" || { echo "::error::backend file not found: ${{ inputs.backend-file }}"; exit 1; }
        test -f "${{ inputs.tfvars-file }}"  || { echo "::error::tfvars file not found: ${{ inputs.tfvars-file }}"; exit 1; }
        cp "${{ inputs.backend-file }}" "${{ inputs.terraform-dir }}/backend.tf"
        cp "${{ inputs.tfvars-file }}" "${{ inputs.terraform-dir }}/deploy.auto.tfvars"
        echo "Injected ${{ inputs.backend-file }} and ${{ inputs.tfvars-file }} into ${{ inputs.terraform-dir }}"

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # Pre-flight: prove the runner can actually reach the AWS APIs Terraform
    # needs, before spending minutes on init/plan.
    #
    # Transport-level failures have been seen mid-plan -- STS returning HTTP 302,
    # EC2 returning 400 "InvalidHttpRequest: Unable to parse request" -- for calls
    # that carry no arguments, while the SAME call succeeded elsewhere in the same
    # run. That is the network path corrupting requests/responses, not Terraform.
    # Buried in hundreds of lines of plan output it reads like a config error, so
    # probe here and fail with an unambiguous message instead.
    - name: Pre-flight AWS API reachability
      shell: bash
      run: |
        set -uo pipefail
        region="${{ inputs.aws-region }}"

        probe() {
          label="$1"; shift
          for attempt in 1 2 3; do
            if out=$("$@" 2>&1); then
              echo "ok: $label (attempt $attempt)"
              return 0
            fi
            echo "fail: $label (attempt $attempt)"
            printf '%s\n' "$out" | head -5
            sleep 3
          done
          return 1
        }

        rc=0
        probe "sts:GetCallerIdentity" \
          aws sts get-caller-identity --region "$region" --output json || rc=1
        probe "ec2:DescribeAvailabilityZones" \
          aws ec2 describe-availability-zones --region "$region" --output json || rc=1

        if [ "$rc" -ne 0 ]; then
          echo "::error::AWS API calls from this runner are failing at the HTTP layer (see attempts above). This is a network/endpoint problem between the runner and AWS, not a Terraform config problem. Check the AWS Health Dashboard for ${region}, then re-run."
          exit 1
        fi
        echo "AWS APIs reachable from this runner."

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    # Locking is S3-native (`use_lockfile = true` in backend.tf) -- no DynamoDB
    # table, so nothing beyond the bucket needs to exist.
    - name: Terraform init (S3 backend, S3 native locking)
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}
      run: |
        set -euo pipefail
        terraform init -input=false \
          -backend-config="bucket=${{ inputs.state-bucket }}" \
          -backend-config="key=${{ inputs.state-key }}" \
          -backend-config="region=${{ inputs.state-region }}" \
          -backend-config="encrypt=true"
