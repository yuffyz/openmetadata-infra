name: Prepare OpenMetadata Terraform
description: >-
  Inject the backend and environment tfvars into the in-repo Terraform project,
  assume the AWS role via OIDC, and run terraform init.

inputs:
  role-arn:
    description: IAM role ARN to assume via GitHub OIDC
    required: true
  aws-region:
    description: AWS region for the AWS CLI / provider
    required: true
  state-bucket:
    description: S3 bucket holding Terraform state
    required: true
  state-key:
    description: S3 key (path) for the state file
    required: true
  state-region:
    description: Region of the state bucket
    required: true
  terraform-dir:
    description: Path (in this repo) to the Terraform root module to deploy
    required: true
  backend-file:
    description: Path (in this repo) to backend.tf to inject
    required: true
  tfvars-file:
    description: Path (in this repo) to the .auto.tfvars to inject for this environment
    required: true
  terraform-version:
    description: Terraform version to install (>= 1.10 for S3 native locking)
    required: false
    default: "1.15.8"

runs:
  using: composite
  steps:
    # Fail fast, naming the setting that is missing.
    #
    # Repository variables and secrets do not travel with the code, so a repo
    # that has never been configured substitutes EMPTY STRINGS for them. That
    # surfaces much later as something unrecognisable -- an empty
    # -backend-config value fails init with "Invalid Value: The value cannot be
    # empty or all whitespace", forty lines into module downloads.
    #
    # `required: true` on a composite action input does not help: it only
    # requires the key to be present, and an empty value satisfies it.
    #
    # Values arrive via env rather than direct ${{ }} interpolation so nothing
    # from a variable or secret is ever pasted into the shell script itself.
    - name: Validate required settings
      shell: bash
      env:
        IN_ROLE_ARN: ${{ inputs.role-arn }}
        IN_AWS_REGION: ${{ inputs.aws-region }}
        IN_STATE_BUCKET: ${{ inputs.state-bucket }}
        IN_STATE_REGION: ${{ inputs.state-region }}
        IN_STATE_KEY: ${{ inputs.state-key }}
        IN_TF_DIR: ${{ inputs.terraform-dir }}
      run: |
        set -uo pipefail
        missing=()
        # empty, or whitespace only
        check() { [ -n "${1//[[:space:]]/}" ] || missing+=("$2"); }

        check "${IN_ROLE_ARN:-}"     "secret AWS_ROLE_ARN"
        check "${IN_AWS_REGION:-}"   "variable AWS_REGION"
        check "${IN_STATE_BUCKET:-}" "variable TF_STATE_BUCKET"
        check "${IN_STATE_REGION:-}" "variable TF_STATE_REGION"
        check "${IN_STATE_KEY:-}"    "workflow env STATE_KEY"
        check "${IN_TF_DIR:-}"       "workflow env TF_DIR"

        if [ "${#missing[@]}" -gt 0 ]; then
          printf '::error::Missing required setting: %s\n' "${missing[@]}"
          echo "::error::Set the above in THIS repository under Settings -> Secrets and variables -> Actions. They are per-repository and are not inherited when a repo is created, forked, or copied from another one."
          exit 1
        fi
        echo "Required settings present:"
        echo "  region       = ${IN_AWS_REGION}"
        echo "  state bucket = ${IN_STATE_BUCKET}"
        echo "  state region = ${IN_STATE_REGION}"
        echo "  state key    = ${IN_STATE_KEY}"
        echo "  terraform    = ${IN_TF_DIR}"

    # The Terraform project lives in this repo, so there is nothing to check out
    # and nothing to patch -- the config is already consistent with the provider
    # and module versions it pins. Only two environment-specific files are
    # injected: the backend (values supplied at init time) and the tfvars.
    #
    # backend.tf is injected rather than committed inside terraform-dir so the
    # same directory stays usable locally with local state (plain `terraform
    # plan` with no S3 bucket or credentials).
    - name: Inject backend + tfvars into the Terraform project
      shell: bash
      run: |
        set -euo pipefail
        test -d "${{ inputs.terraform-dir }}" || { echo "::error::terraform dir not found: ${{ inputs.terraform-dir }}"; exit 1; }
        test -f "${{ inputs.backend-file }}" || { echo "::error::backend file not found: ${{ inputs.backend-file }}"; exit 1; }
        test -f "${{ inputs.tfvars-file }}"  || { echo "::error::tfvars file not found: ${{ inputs.tfvars-file }}"; exit 1; }
        cp "${{ inputs.backend-file }}" "${{ inputs.terraform-dir }}/backend.tf"
        cp "${{ inputs.tfvars-file }}" "${{ inputs.terraform-dir }}/deploy.auto.tfvars"
        echo "Injected ${{ inputs.backend-file }} and ${{ inputs.tfvars-file }} into ${{ inputs.terraform-dir }}"

    # Prints the OIDC claims that AWS is about to be asked to match, so a failure
    # in the next step is self-explaining. "Not authorized to perform
    # sts:AssumeRoleWithWebIdentity" means the role's trust policy did not match
    # the `sub` below -- compare them byte for byte (matching is case-sensitive):
    #   aws iam get-role --role-name <role> --query Role.AssumeRolePolicyDocument
    #
    # `sub` encodes HOW the job runs, not just which repo:
    #   dispatch on a branch  -> repo:ORG/REPO:ref:refs/heads/<branch>
    #   job with environment: -> repo:ORG/REPO:environment:<name>
    #   pull request          -> repo:ORG/REPO:pull_request
    #
    # Only a whitelist of claims is printed and the token is masked, so nothing
    # usable leaks into the log. Never fails the job: if the claims can't be
    # read, the next step produces the real error and this one has annotated why.
    - name: Debug OIDC claims
      shell: bash
      run: |
        set -uo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::No OIDC token available to this job. The calling job needs 'permissions: id-token: write'. Note that a job-level permissions block REPLACES the workflow-level one, so a job setting only 'contents: read' silently loses id-token."
          exit 0
        fi
        token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value // empty')
        if [ -z "$token" ]; then
          echo "::warning::Could not fetch an OIDC token; skipping claim dump."
          exit 0
        fi
        echo "::add-mask::$token"
        payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
        case $(( ${#payload} % 4 )) in
          2) payload="${payload}==" ;;
          3) payload="${payload}=" ;;
        esac
        echo "OIDC claims presented to sts:AssumeRoleWithWebIdentity:"
        printf '%s' "$payload" | base64 -d 2>/dev/null \
          | jq '{iss, aud, sub, repository, repository_owner, ref, environment, job_workflow_ref}' \
          || echo "::warning::Could not decode the token payload."
        echo "Role being assumed: ${{ inputs.role-arn }}"

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # Pre-flight: prove the runner can actually reach the AWS APIs Terraform
    # needs, before spending minutes on init/plan.
    #
    # Transport-level failures have been seen mid-plan -- STS returning HTTP 302,
    # EC2 returning 400 "InvalidHttpRequest: Unable to parse request" -- for calls
    # that carry no arguments, while the SAME call succeeded elsewhere in the same
    # run. That is the network path corrupting requests/responses, not Terraform.
    # Buried in hundreds of lines of plan output it reads like a config error, so
    # probe here and fail with an unambiguous message instead.
    - name: Pre-flight AWS API reachability
      shell: bash
      run: |
        set -uo pipefail
        region="${{ inputs.aws-region }}"

        probe() {
          label="$1"; shift
          for attempt in 1 2 3; do
            if out=$("$@" 2>&1); then
              echo "ok: $label (attempt $attempt)"
              return 0
            fi
            echo "fail: $label (attempt $attempt)"
            printf '%s\n' "$out" | head -5
            sleep 3
          done
          return 1
        }

        rc=0
        probe "sts:GetCallerIdentity" \
          aws sts get-caller-identity --region "$region" --output json || rc=1
        probe "ec2:DescribeAvailabilityZones" \
          aws ec2 describe-availability-zones --region "$region" --output json || rc=1

        if [ "$rc" -ne 0 ]; then
          echo "::error::AWS API calls from this runner are failing at the HTTP layer (see attempts above). This is a network/endpoint problem between the runner and AWS, not a Terraform config problem. Check the AWS Health Dashboard for ${region}, then re-run."
          exit 1
        fi
        echo "AWS APIs reachable from this runner."

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    # Locking is S3-native (`use_lockfile = true` in backend.tf) -- no DynamoDB
    # table, so nothing beyond the bucket needs to exist.
    - name: Terraform init (S3 backend, S3 native locking)
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}
      run: |
        set -euo pipefail
        # -lockfile=readonly: install exactly what terraform/.terraform.lock.hcl
        # pins and fail if it would have to change. plan and apply run on
        # separate runners, so without this each resolves providers on its own
        # and a registry release between them leaves apply rejecting the saved
        # plan with "Inconsistent dependency lock file" -- at random, since it
        # depends on release timing.
        #
        # If this step fails with a lock file error, the constraints in
        # versions.tf moved and the lock was not regenerated. Fix it in a
        # commit, not by dropping this flag:
        #
        #   terraform init -upgrade
        #   terraform providers lock \
        #     -platform=linux_amd64 -platform=darwin_arm64 -platform=darwin_amd64
        terraform init -input=false -lockfile=readonly \
          -backend-config="bucket=${{ inputs.state-bucket }}" \
          -backend-config="key=${{ inputs.state-key }}" \
          -backend-config="region=${{ inputs.state-region }}" \
          -backend-config="encrypt=true"
